<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../libs/css/uspi.css">
  <style>.uspi-item-label{width:90px}.hint{font-size:12px;opacity:.65;margin:6px 0 0 4px;line-height:1.4}.hint a{color:#5eead4;cursor:pointer}</style>
</head>
<body>
  <div class="uspi-wrapper">
    <form id="property-inspector">
      <div class="uspi-item">
        <div class="uspi-item-label">Phone</div>
        <select class="uspi-item-value select" id="phoneId" name="phoneId"><option value="">Loading…</option></select>
      </div>
    </form>
    <div class="hint">Press to stream the phone's audio to this PC, press again to disconnect. The phone must be paired via Bluetooth. <a id="reload">Reload</a></div>
  </div>
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script>
    let settings = {};
    let phones = null;
    const sel = document.getElementById('phoneId');
    function render() {
      const list = phones || [];
      sel.innerHTML = '<option value="">First paired phone (auto)</option>' +
        list.map(p => '<option value="' + p.id.replace(/"/g, '&quot;') + '">' + p.name.replace(/</g, '&lt;') + '</option>').join('');
      if (settings.phoneId && !list.some(p => p.id === settings.phoneId))
        sel.insertAdjacentHTML('beforeend', '<option value="' + settings.phoneId.replace(/"/g, '&quot;') + '">(saved phone, not found)</option>');
      sel.value = settings.phoneId || '';
    }
    const load = j => { if (j && j.param) { settings = j.param; if (phones) render(); } };
    $UD.connect('com.ulanzi.ulanzistudio.pctools.phone');
    $UD.onConnected(() => $UD.sendToPlugin({ request: 'phones' }));
    $UD.onAdd(load);
    $UD.onParamFromApp(load);
    $UD.onSendToPropertyInspector(j => { const p = j.payload || {}; if (p.phones) { phones = p.phones; render(); } });
    sel.addEventListener('change', () => { settings = { phoneId: sel.value }; $UD.sendParamFromPlugin(settings); });
    document.getElementById('reload').addEventListener('click', () => $UD.sendToPlugin({ request: 'phones' }));
  </script>
</body>
</html>
